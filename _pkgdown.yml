reference:
- title: State-first composition
  desc: >
    The recommended workflow. Treat the layout as an editable composition
    object — a dragmapr_state — and carry it through compute, compose, render.
    Includes the friendly editor front door and the full state lifecycle
    (validate, merge, inherit/collapse across levels, apply, snapshot/restore,
    and JSON read/write).
  contents:
  - dragmapr_edit
  - dragmapr_state
  - validate_dragmapr_state
  - merge_dragmapr_state
  - inherit_drag_offsets
  - collapse_drag_offsets
  - apply_dragmapr_state
  - snapshot_dragmapr_state
  - write_dragmapr_state

- title: Native widget (htmlwidget and Shiny)
  desc: >
    The browser-native draggable editor and its Shiny bridge: build the widget,
    bind and render it in Shiny, push live display and selection updates, and
    rebuild a dragmapr_state from the edits the browser reports back.
  contents:
  - dragmapr_widget
  - dragmapr_widget_state
  - dragmaprOutput
  - updateDragmapr
  - dragmapr_geometry_options

- title: Interactive prototype
  desc: >
    Create the browser-based D3 helper. This is the primary deliverable:
    open it, drag, then copy or download the offset tables.
  contents:
  - drag_map_prototype

- title: Region offsets
  desc: Read and apply the region movement tables exported by the helper.
  contents:
  - read_offsets
  - apply_offsets

- title: Labels
  desc: >
    Derive default label anchors, supply custom labels or annotation boxes,
    configure connectors, and restore label positions from exported state.
  contents:
  - make_region_labels
  - as_drag_labels
  - as_drag_annotations
  - select_label_ids
  - read_label_state
  - apply_label_state

- title: Static rendering
  desc: >
    Optionally reconstruct the dragged layout as a ggplot2 image from the
    source geometry plus exported region and label offset tables.
  contents:
  - render_dragged_map
  - render_dragmapr_project
  - read_dragmapr_project
  - write_dragmapr_project

- title: Built-in examples
  desc: Self-contained fixtures for testing and demonstrations.
  contents:
  - example_hhs_layout
  - example_panel_layout

- title: Hierarchy and branch bloom
  desc: >
    Detect parent-child grouping columns, prepare branch-bloom helper data,
    and explain CRS meaning for uploaded spatial files.
  contents:
  - make_hierarchy_key
  - inherit_layout
  - create_layout_snapshot
  - restore_layout_snapshot
  - detect_hierarchy_columns
  - recommend_dragmapr_hierarchy
  - validate_bloom_hierarchy
  - build_branch_transition_data
  - make_branch_bloom_labels
  - transition_options
  - build_elastic_transition
  - make_group_boundaries
  - layout_metrics
  - summarise_spatial_crs
  - profile_spatial_upload
  - suggest_offsets
  - dragmapr_diagnostics

- title: Spatial I/O helpers
  desc: >
    Read spatial files from Shiny uploads or URLs, project and validate
    geometry, and build the JavaScript bridge that relays drag state from the
    helper iframe back to Shiny inputs.  These helpers are extracted from the
    spatial studio example so apps can reuse them independently.
  contents:
  - read_dragmapr_sf_upload
  - read_dragmapr_sf_url
  - prepare_dragmapr_sf
  - dragmapr_iframe_bridge

- title: RStudio addin
  desc: Launch the interactive prototype from the RStudio Addins menu.
  contents:
  - dragmapr_addin

- title: Compatibility aliases
  desc: Earlier names kept for backward compatibility.
  contents:
  - make_labels
  - read_label_offsets
  - apply_label_offsets

