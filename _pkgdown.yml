reference:
- title: State-first composition
  desc: >
    Keep manual edits in a dragmapr_state, then use the same state for
    browser editing, Shiny apps, static rendering, snapshots, and JSON
    round-trips.
  contents:
  - dragmapr_edit
  - dragmapr_state
  - dragmapr_state_diff
  - dragmapr_state_equal
  - summary.dragmapr_state
  - validate_dragmapr_state
  - merge_dragmapr_state
  - inherit_drag_offsets
  - collapse_drag_offsets
  - apply_dragmapr_state
  - snapshot_dragmapr_state
  - write_dragmapr_state

- title: Native widget (htmlwidget and Shiny)
  desc: >
    Render a draggable map directly in Shiny, receive structured edit events,
    and update display options without rebuilding the geometry.
  contents:
  - dragmapr_widget
  - dragmapr_widget_state
  - dragmaprOutput
  - updateDragmapr
  - dragmapr_geometry_options

- title: Interactive prototype
  desc: >
    Write a standalone HTML editor for quick layout work outside a Shiny app.
  contents:
  - drag_map_prototype

- title: Region offsets
  desc: Read and apply exported region movement tables.
  contents:
  - read_offsets
  - apply_offsets

- title: Labels
  desc: >
    Derive default label anchors, supply custom labels or annotation boxes,
    configure connectors, and restore label positions from exported state.
  contents:
  - make_region_labels
  - as_drag_labels
  - as_drag_annotations
  - select_label_ids
  - read_label_state
  - apply_label_state

- title: Static rendering
  desc: >
    Rebuild edited layouts as ggplot2 images, PNGs, PDFs, or project bundles.
  contents:
  - render_dragged_map
  - render_dragmapr_project
  - read_dragmapr_project
  - write_dragmapr_project

- title: Built-in examples
  desc: Self-contained fixtures for testing and demonstrations.
  contents:
  - example_hhs_layout
  - example_panel_layout

- title: Hierarchy and branch bloom
  desc: >
    Detect parent-child grouping columns, prepare branch-bloom helper data,
    and explain CRS meaning for uploaded spatial files.
  contents:
  - make_hierarchy_key
  - inherit_layout
  - create_layout_snapshot
  - restore_layout_snapshot
  - detect_hierarchy_columns
  - recommend_dragmapr_hierarchy
  - validate_bloom_hierarchy
  - build_branch_transition_data
  - make_branch_bloom_labels
  - transition_options
  - build_elastic_transition
  - make_group_boundaries
  - layout_metrics
  - summarise_spatial_crs
  - profile_spatial_upload
  - suggest_offsets
  - dragmapr_diagnostics

- title: Spatial I/O helpers
  desc: >
    Read spatial files from Shiny uploads or URLs, project and validate
    geometry, and reuse the bridge helpers that power the spatial studio apps.
  contents:
  - read_dragmapr_sf_upload
  - read_dragmapr_sf_url
  - prepare_dragmapr_sf
  - dragmapr_iframe_bridge

- title: Editable spatial features
  desc: >
    Inspect, remove, keep, add, or replace source geography before or during a
    dragmapr workflow. These helpers support Shiny review tables and reversible
    geography edits.
  contents:
  - spatial_feature_table
  - remove_spatial_features
  - add_spatial_features

- title: RStudio addin
  desc: Launch the interactive prototype from the RStudio Addins menu.
  contents:
  - dragmapr_addin

- title: Compatibility aliases
  desc: Earlier names kept for backward compatibility.
  contents:
  - make_labels
  - read_label_offsets
  - apply_label_offsets

articles:
- title: Workflows
  navbar: ~
  contents:
  - state-first-workflow
  - getting-started
  - dragmap-demo
  - hhs-placeholder-shapes-demo
  - labels-and-static-output
  - example-gallery
  - shiny-workflows
