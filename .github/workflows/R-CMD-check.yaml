# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Workaround 2026-09-20: the PPM macOS arm64 binaries rebuilt on
      # 2026-09-16 (knitr, xfun, sf, glasstabs) are corrupt (zstd served as
      # .tgz), so pin macOS to a snapshot that predates that batch. Revisit
      # once PPM rebuilds them.
      - name: Pin PPM snapshot on macOS
        if: matrix.config.os == 'macos-latest'
        run: echo "RSPM=https://packagemanager.posit.co/cran/2026-09-15" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Workaround 2026-09-21: PPM's macOS binary for xfun 0.61 is still
      # corrupt at the pinned snapshot, so install xfun from source (pure R,
      # no compilation) after R is installed but before pak resolves
      # dependencies; pak then sees the required version already installed
      # and never downloads the bad .tgz.
      - name: Install xfun from source on macOS
        if: matrix.config.os == 'macos-latest'
        run: Rscript -e 'install.packages("xfun", type = "source", repos = "https://packagemanager.posit.co/cran/2026-09-15")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            github::PrigasG/explodemap
            github::PrigasG/glasstabs
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
